<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" role="img" aria-label="3D artist workstation with a monitor showing a modelled cube">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a33"/>
      <stop offset="0.55" stop-color="#0a1122"/>
      <stop offset="1" stop-color="#05070f"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d3b5c"/>
      <stop offset="0.6" stop-color="#07202f"/>
      <stop offset="1" stop-color="#041018"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3550"/>
      <stop offset="1" stop-color="#141a29"/>
    </linearGradient>
    <linearGradient id="cubeTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fe8ff"/>
      <stop offset="1" stop-color="#3ea8d8"/>
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f7fa8"/>
      <stop offset="1" stop-color="#1d4c6b"/>
    </linearGradient>
    <linearGradient id="cubeRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c5d80"/>
      <stop offset="1" stop-color="#0f3348"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1000" height="1000" fill="url(#bg)"/>

  <!-- glow behind -->
  <ellipse cx="500" cy="420" rx="330" ry="280" fill="#00aaff" opacity="0.18" filter="url(#soft)"/>
  <ellipse cx="760" cy="700" rx="230" ry="180" fill="#7a5cff" opacity="0.16" filter="url(#soft)"/>

  <!-- wall accent lines -->
  <g stroke="#00aaff" stroke-width="1.5" opacity="0.10">
    <path d="M0 150 H1000 M0 260 H1000 M0 370 H1000"/>
    <path d="M120 0 V600 M260 0 V600 M700 0 V600 M860 0 V600"/>
  </g>

  <!-- desk -->
  <path d="M60 780 L940 780 L900 900 L100 900 z" fill="url(#desk)"/>
  <path d="M60 780 L940 780" stroke="#5d708f" stroke-width="4" opacity="0.7"/>

  <!-- monitor -->
  <g>
    <rect x="230" y="250" width="540" height="360" rx="24" fill="#0b1119" stroke="#39465e" stroke-width="8"/>
    <rect x="252" y="272" width="496" height="310" rx="12" fill="url(#screen)"/>

    <!-- viewport grid -->
    <g stroke="#2ad1ff" stroke-width="1" opacity="0.18">
      <path d="M252 382 H748 M252 492 H748 M336 272 V582 M420 272 V582 M504 272 V582 M588 272 V582 M672 272 V582"/>
    </g>

    <!-- axis gizmo -->
    <g transform="translate(690 540)" stroke-width="3">
      <path d="M0 0 L34 -12" stroke="#ff5a6e"/>
      <path d="M0 0 L-26 -20" stroke="#42ff9e"/>
      <path d="M0 0 L0 -38" stroke="#4da4ff"/>
      <circle cx="0" cy="0" r="4" fill="#dfeaff" stroke="none"/>
    </g>

    <!-- wireframe cube -->
    <g stroke="#9fe8ff" stroke-width="2.5" fill="none" opacity="0.5">
      <path d="M400 400 L500 350 L600 400 L500 450 z"/>
      <path d="M400 400 v110 L500 560 L600 510 v-110 M500 450 v110"/>
      <path d="M400 510 L500 560" opacity="0.8"/>
    </g>

    <!-- solid cube -->
    <g>
      <path d="M500 383 L590 428 L500 473 L410 428 z" fill="url(#cubeTop)"/>
      <path d="M410 428 L500 473 L500 573 L410 528 z" fill="url(#cubeLeft)"/>
      <path d="M590 428 L500 473 L500 573 L590 528 z" fill="url(#cubeRight)"/>
      <path d="M500 383 L590 428 L500 473 L410 428 z" fill="#ffffff" opacity="0.12"/>
    </g>

    <!-- selection outline -->
    <g stroke="#00e5ff" stroke-width="2.5" fill="none" filter="url(#glow)">
      <path d="M500 383 L590 428 L590 528 L500 573 L410 528 L410 428 z"/>
      <path d="M500 383 L500 473 M410 428 L500 473 L590 428 M500 473 L500 573"/>
    </g>

    <!-- screen hud -->
    <g fill="#7fe6ff" opacity="0.75">
      <rect x="272" y="290" width="90" height="8" rx="4" opacity="0.5"/>
      <rect x="272" y="308" width="58" height="8" rx="4" opacity="0.3"/>
      <rect x="640" y="290" width="88" height="8" rx="4" opacity="0.4"/>
      <rect x="272" y="550" width="46" height="8" rx="4" opacity="0.35"/>
    </g>
    <g fill="#00ffd5" opacity="0.9">
      <circle cx="700" cy="560" r="4"/>
      <circle cx="716" cy="560" r="4" opacity="0.6"/>
      <circle cx="732" cy="560" r="4" opacity="0.35"/>
    </g>

    <!-- stand -->
    <path d="M470 610 h60 v34 h-60 z" fill="#1a2333"/>
    <path d="M420 660 q80 -26 160 0 l-12 22 h-136 z" fill="#232e42"/>
    <rect x="410" y="668" width="180" height="14" rx="7" fill="#2d3a51"/>
  </g>

  <!-- desk lamp -->
  <g>
    <ellipse cx="150" cy="790" rx="70" ry="14" fill="#000" opacity="0.5" filter="url(#soft)"/>
    <path d="M150 780 v-90 l60 -60" stroke="#43526b" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M210 630 l40 -14 l26 52 l-44 22 z" fill="#2a354a"/>
    <circle cx="238" cy="672" r="16" fill="#ffd98a" filter="url(#glow)"/>
    <path d="M225 690 L150 790 L330 790 z" fill="#ffd98a" opacity="0.10"/>
    <rect x="120" y="770" width="60" height="22" rx="8" fill="#1e2838"/>
  </g>

  <!-- tablet / sketchbook -->
  <g transform="rotate(-8 760 800)">
    <rect x="660" y="760" width="200" height="110" rx="12" fill="#232e42" stroke="#46587a" stroke-width="3"/>
    <rect x="676" y="776" width="168" height="78" rx="6" fill="#0e1723"/>
    <g stroke="#00d5ff" stroke-width="2" opacity="0.55" fill="none">
      <path d="M696 830 q24 -34 48 -8 t48 -20 t36 10"/>
    </g>
    <circle cx="812" cy="800" r="6" fill="#00ffd5" filter="url(#glow)"/>
  </g>

  <!-- coffee mug -->
  <g>
    <ellipse cx="345" cy="782" rx="42" ry="10" fill="#000" opacity="0.4" filter="url(#soft)"/>
    <path d="M312 716 h66 v52 q0 16 -33 16 t-33 -16 z" fill="#243046"/>
    <path d="M378 726 q26 2 22 22 t-24 16" fill="none" stroke="#243046" stroke-width="9"/>
    <ellipse cx="345" cy="716" rx="33" ry="9" fill="#101a26"/>
    <path d="M330 700 q8 -14 0 -24 M348 702 q8 -16 0 -28" stroke="#8fa6c8" stroke-width="3" fill="none" opacity="0.4"/>
  </g>

  <!-- floating particles -->
  <g fill="#bfe6ff">
    <circle cx="140" cy="330" r="3" opacity="0.6"/>
    <circle cx="880" cy="300" r="4" opacity="0.7"/>
    <circle cx="820" cy="470" r="2.5" opacity="0.5"/>
    <circle cx="180" cy="560" r="2" opacity="0.5"/>
    <circle cx="930" cy="600" r="3" opacity="0.55"/>
  </g>

  <!-- frame corners (camera viewfinder motif) -->
  <g stroke="#00c8ff" stroke-width="3" opacity="0.35">
    <path d="M50 130 h54 M50 130 v54"/>
    <path d="M950 130 h-54 M950 130 v54"/>
    <path d="M50 930 h54 M50 930 v-54"/>
    <path d="M950 930 h-54 M950 930 v-54"/>
  </g>

  <radialGradient id="vig" cx="50%" cy="45%" r="72%">
    <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity="0.6"/>
  </radialGradient>
  <rect width="1000" height="1000" fill="url(#vig)"/>
</svg>
